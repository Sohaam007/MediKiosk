version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medikiosk
      POSTGRES_USER: medikiosk
      POSTGRES_PASSWORD: medikiosk_dev_secret
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "medikiosk", "-d", "medikiosk"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+asyncpg://medikiosk:medikiosk_dev_secret@db:5432/medikiosk
      REDIS_URL: redis://cache:6379/0
      API_KEY: kiosk_dev_key
      STORAGE_BASE_PATH: /app/data/storage
      CORS_ORIGINS: '["*"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - storagedata:/app/data/storage

volumes:
  pgdata:
  redisdata:
  storagedata:
