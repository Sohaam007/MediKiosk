name: CI

on:
  push:
    branches:
      - master
      - main
      - 'feat/*'
      - 'feat/**'
  pull_request:
    branches:
      - master
      - main
      - 'feat/*'
      - 'feat/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  CI: "true"

jobs:
  backend:
    name: Backend (Python 3.11, uv, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with Ruff
        run: uv run ruff check

      - name: Check code formatting
        run: uv run ruff format --check

      - name: Type check with MyPy (Strict)
        run: uv run mypy src/ --strict

      - name: Enforce architectural invariants (Purity, Imports, Audit)
        run: uv run pytest tests/invariants/ -v

      - name: Run Pytest test suite (Unit, Integration, E2E)
        run: uv run pytest tests/ -v

  frontend:
    name: Frontend (Node 20, Vite, TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend code
        working-directory: frontend
        run: npm run lint

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  gate:
    name: Quality Gate (All Checks Passed)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate pipeline status
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "::error::One or more CI checks failed."
            exit 1
          fi
          echo "All backend and frontend quality gates passed!"
