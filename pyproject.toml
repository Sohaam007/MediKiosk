[project]
name = "medikiosk"
version = "0.2.0"
description = "AI-powered clinical intake platform for Indian hospitals"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"
authors = [
    { name = "Soham Paul", email = "dhrubo2575@gmail.com" },
    { name = "Soumyadeep Pal" },
]

dependencies = [
    # Core
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    # API
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "python-multipart>=0.0.6",
    # LLM Providers
    "google-genai>=1.0",
    "openai>=1.30",
    # Database
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",           # async SQLite for development
    "asyncpg>=0.29",             # async PostgreSQL for production
    # HTTP Client
    "httpx>=0.27",
    # Image Processing
    "Pillow>=10.0",
    # FHIR
    "fhir.resources>=7.1",
    # Logging
    "structlog>=24.1",
    # Utilities
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.8",
    "ruff>=0.3",
    "httpx",                     # for TestClient
    "types-python-dateutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medikiosk"]

# ─── Mypy ─────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_reexport = true
packages = ["medikiosk"]
mypy_path = ["src"]



# ─── Ruff ─────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = [
    ".agents",
    ".git",
    ".venv",
    "backend",
    "core",
    "kiosk",
    "server",
    "eval",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "S",      # bandit (security)
    "B",      # bugbear
    "A",      # builtins shadowing
    "C4",     # flake8-comprehensions
    "DTZ",    # datetime timezone
    "T20",    # print statements
    "RUF",    # ruff-specific
]
ignore = [
    "S101",   # allow assert in tests
    "S104",   # allow binding to 0.0.0.0
    "UP042",  # allow enum inheriting from str
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "T20"]
"scripts/**/*.py" = ["T20"]
"src/medikiosk/domain/intake/clinical_questions.py" = ["E501"]
"tests/unit/domain/intake/test_clinical_questions.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

# ─── Pytest ───────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure domain logic tests (fast, no I/O)",
    "integration: tests with real infrastructure",
    "e2e: end-to-end API tests",
    "invariant: architectural rule enforcement",
]
